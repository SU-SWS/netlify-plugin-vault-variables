name: Release

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      publish_only:
        description: 'Skip the version bump and GitHub release, and publish the version already in package.json on the selected branch'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: ${{ !inputs.publish_only }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.bump_commit.outputs.sha }}

    steps:
      - uses: actions/checkout@v7
        # Specify a different token to allow pushing changes to main later
        with:
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
      - name: Set Git user
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "Github Action"
      - name: Version Bump
        id: version_bump
        uses: phips28/gh-action-bump-version@63bc5b97aade4390bf3f33416b8adb891a0f28d7 # v12.0.2
        with:
          skip-tag: 'true'
          commit-message: "ci: version bump to {{version}} [skip ci]"
        # Specify a different token to allow pushing change to main
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
      - name: Record version bump commit
        id: bump_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish Release
        id: release
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          version: ${{ steps.version_bump.outputs.newTag }}
          publish: true
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
      - name: Merge release back into dev
        uses: devmasx/merge-branch@854d3ac71ed1e9deb668e0074781b81fdd6e771f # 1.4.0
        with:
          type: now
          from_branch: main
          target_branch: dev
          github_token: ${{ secrets.ADMIN_GITHUB_TOKEN }}

  # Publishing is its own job so that:
  # - only first-party actions run with permission to mint npm credentials, and
  # - a failed publish can be retried with "Re-run failed jobs" without
  #   bumping the version or cutting another GitHub release.
  # Runs after a successful release, or on its own for a publish_only dispatch.
  publish:
    name: Publish to npm
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || (inputs.publish_only && needs.release.result == 'skipped')) }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Publish to npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "$name@$version is already on npm, nothing to publish."
            exit 0
          fi
          npm publish
